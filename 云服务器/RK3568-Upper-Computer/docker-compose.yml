services:
  rk3568-manager:
    build:
      context: .
    container_name: rk3568-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./db:/app/db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/config', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
